name: CPU-only test suite

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidpy-cpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SolidPy core and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests without GPU requirements
        run: python -m pytest -q -m "not gpu"
