name: Optional GPU backend parity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidpy-gpu-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gpu-parity:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    env:
      SOLIDPY_REQUIRE_GPU: "1"
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SolidPy with the CUDA backend
        run: python -m pip install -e ".[dev,jax-cuda12]"
      - name: Confirm JAX can see an accelerator
        run: >-
          python -c 'import jax; devices = jax.devices(); print(devices);
          assert any(device.platform != "cpu" for device in devices), "JAX has no accelerator device"'
      - name: Run accelerator parity tests
        run: >-
          python -m pytest -q -m gpu
          tests/test_backend_jax.py
          tests/test_structural_monte_carlo_backend.py
          tests/test_batch_advanced_physics.py
          tests/test_batch_detailed_ballistics.py
          tests/test_surrogate_physics.py
