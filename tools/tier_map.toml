# Which scalar entry points have a batched implementation, for ``tools/profile_workloads.py``.
#
# The profiler times each entry point outermost-first on a real workload and reports
#     offloaded_share = seconds in entry points with batched = true / total seconds of the workload
# (docs/gpu_backend_architecture.md, section 7.1). Entry points must not nest inside one another, so that no second
# is counted twice. Keep this file in step with the code: set ``batched = true`` in the commit that adds the batched
# implementation, not before.
#
# tier: T0 required for the first release, T1 next, T2 later or CPU by design (architecture document, section 7).

[[entry]]
path = "solidpy.Burn.BurnSimulation.__init__"
tier = "T0"
batched = true
note = "burn and tail-off solve and the canonical result (solidpy.ensemble.simulate_burn; scenarios of Robustness are lanes through run_robustness_ensemble)"

[[entry]]
path = "solidpy.DetailedBallistics.build_detailed_ballistics"
tier = "T1"
batched = true
note = "ragged histories and grain geometries use the detailed_ballistics service on NumPy/JAX; callbacks and unsupported grain shapes use the scalar path"

[[entry]]
path = "solidpy.Multiphysics.simulate_thermal_ablation"
tier = "T1"
batched = true
note = "1-D wall conduction, a Radau IIA(5) solve per time step (solidpy.ensemble.simulate_thermal and run_advanced_physics_ensemble; batched Radau with the scipy controller, step for step)"

[[entry]]
path = "solidpy.Multiphysics.simulate_structural_response"
tier = "T1"
batched = true
note = "general transient curves are lanes in the advanced_physics_proxies service; StructuralMonteCarlo peak-pressure histories use their existing lane kernel"

[[entry]]
path = "solidpy.Multiphysics.StructuralMonteCarlo.run"
tier = "T1"
batched = true
note = "W4 peak-pressure scenarios are lanes on cpu-vectorized or JAX; callback sampling and report assembly stay on the host"

[[entry]]
path = "solidpy.Multiphysics.simulate_cfd_proxies"
tier = "T1"
batched = true
note = "curve histories, geometry and thermal metrics run as lanes in advanced_physics_proxies"

[[entry]]
path = "solidpy.Multiphysics.simulate_ignition_proxy"
tier = "T1"
batched = true
note = "curve histories, geometry, thermal metrics and structural summaries run as lanes in advanced_physics_proxies"

[[entry]]
path = "solidpy.Multiphysics.simulate_flight_1d"
tier = "T2"
batched = false
note = "separate ODE system; CPU by design for now"
