[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "solidpy"
version = "0.1.0"
description = "Internal ballistics simulator for solid propellant rocket motors."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Projeto Jupiter" },
]
dependencies = [
  "ambiance>=1.3",
  "matplotlib>=3.0",
  "numpy>=1.20",
  "scipy>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["solidpy"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "solidpy",
  "tests",
]
