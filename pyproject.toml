[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "solidpy"
version = "0.1.0"
description = "Internal ballistics simulator for solid propellant rocket motors."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Projeto Jupiter" },
]
dependencies = [
  "ambiance>=1.3",
  "matplotlib>=3.0",
  "numpy>=1.20",
  "scipy>=1.8",
]

[project.optional-dependencies]
cea = [
  "rocketcea>=1.2",
]
dev = [
  "pytest>=7",
]
# Accelerated batch backends. Each one is optional: the base install is unchanged and stays CPU-only.
jax = [
  "jax>=0.4.30; python_version >= '3.10'",
]
jax-cuda12 = [
  "jax[cuda12]>=0.4.30; python_version >= '3.10'",
]
# Convenience aliases.
gpu = [
  "solidpy[jax-cuda12]",
]
all = [
  "solidpy[cea,jax-cuda12]",
]

[tool.hatch.build.targets.wheel]
packages = ["solidpy"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "solidpy",
  "tests",
]
addopts = "--strict-markers"
markers = [
  "gpu: needs an accelerator device; skipped when none is available",
  "slow: minutes long (the whole golden corpus); skipped unless --runslow is given",
]
